name: Publish research report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand uploaded project
        if: hashFiles('github-source.zip') != ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          with zipfile.ZipFile('github-source.zip') as archive:
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts or any(p in {'.git', '.github', '.openai'} for p in path.parts):
                      raise ValueError(f'Unexpected archive path: {entry.filename}')
                  target = root / path
                  if entry.is_dir(): target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
          Path('github-source.zip').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Import complete CRISP-DM analysis and interactive report'
          git push origin HEAD:main
      - name: Check report assets
        run: |
          test -f dist/index.html
          test -f dist/report.js
          test -f dist/startup-lab-source.zip
          node --check dist/report.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
